[project]
name = "ha-warp"
version = "0.0.0"
description = "Home Assistant integration for Tinkerforge WARP chargers (dev environment)"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "warp-charger==0.1.0",  # keep in sync with manifest.json (tests/test_manifest.py)
    "pytest-homeassistant-custom-component==0.13.371",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["warp_charger", "custom_components", "tests", "conftest"]
