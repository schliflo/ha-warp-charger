version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3  # GitHub default; own lib exempt
      exclude: ["warp-charger"]
    groups:
      warp-charger:
        patterns: ["warp-charger"]
      home-assistant:
        patterns: ["pytest-homeassistant-custom-component", "homeassistant"]
      dev:
        dependency-type: development
        exclude-patterns: ["pytest-homeassistant-custom-component", "homeassistant", "warp-charger"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
